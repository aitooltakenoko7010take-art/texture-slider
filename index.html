<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Texture Comparison</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
            color: #eee;
        }

        .comparison-container {
            position: relative;
            width: 90vw;
            max-width: 800px;
            aspect-ratio: 1024 / 768; 
            overflow: hidden;
            border: 2px solid #444;
            user-select: none;
        }

        /* 下に配置する画像（テクスチャあり） */
        .img-background {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 上に重なる画像（テクスチャなし）を切り取るコンテナ */
        .img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%; /* ここがスライダーで動く */
            height: 100%;
            overflow: hidden;
            border-right: 3px solid #fff;
            z-index: 2;
        }

        /* 重なる画像自体のサイズは常に100%に固定 */
        .img-overlay img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 親要素(800px等)と同じ幅を維持させるための設定 */
            position: absolute;
            top: 0;
            left: 0;
        }

        .slider-handle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 44px; /* 少し大きく */
  height: 44px;
  background-color: #fff;
  border-radius: 50%;
  z-index: 10;
  pointer-events: none;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  /* 矢印を中央に配置するための設定 */
  display: flex;
  justify-content: center;
  align-items: center;
  color: #333;
  font-size: 20px;
  font-weight: bold;
}

/* 矢印アイコンの追加 */
.slider-handle::before {
  content: "‹";
  margin-right: 4px;
}
.slider-handle::after {
  content: "›";
  margin-left: 4px;
}

        .comparison-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: ew-resize;
            z-index: 11;
            margin: 0;
        }

        .label {
            position: absolute;
            bottom: 10px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.6);
            font-size: 0.8rem;
            z-index: 5;
        }
        .label-before { left: 10px; }
        .label-after { right: 10px; }
    </style>
</head>

        <input type="range" min="0" max="100" value="50" class="comparison-input" id="slider">

    <script>
        const slider = document.getElementById('slider');
        const overlay = document.getElementById('overlay');
        const handle = document.getElementById('handle');
        const container = document.getElementById('container');
        const overlayImg = document.getElementById('overlay-img');

        function updateSlider() {
            const value = slider.value;
            overlay.style.width = value + '%';
            handle.style.left = value + '%';
            
            // 重要：重なっている画像が縮まないように、親コンテナと同じ幅を強制する
            overlayImg.style.width = container.offsetWidth + 'px';
        }

        slider.addEventListener('input', updateSlider);
        window.addEventListener('resize', updateSlider);
        window.addEventListener('load', updateSlider);
        
        // 初回実行
        updateSlider();
    </script>
